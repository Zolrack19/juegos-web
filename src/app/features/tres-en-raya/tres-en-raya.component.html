<section class="tres-en-raya-juego">
  <div class="tres-contenedor">
    <div class="tres-tablero" (click)="hacerJugada($event)">
      @for (item of matriz; let i = $index; track $index) {
        <div class="tres-celda" [attr.data-i]="i">
          <div *ngIf="item === -1" class="tres-o">
          </div>
          <div *ngIf="item === 1" class="tres-x">
            <div class="x-1">
            </div>
            <div class="x-2">
            </div>
          </div>
        </div>
      }
    </div>
    <div *ngIf="estadoJuego === 3" class="tres-menu">
      <div id="menu-titulo"><span>{{text}}</span></div>
      <div id="menu-opciones" translate="no" spellcheck="false" draggable="false">
        <div (click)="iniciarJuego()">Jugar solo</div>
        <div (click)="iniciarJuego(true)">Jugar vs IA</div>
      </div>
    </div>
  </div>
</section>
